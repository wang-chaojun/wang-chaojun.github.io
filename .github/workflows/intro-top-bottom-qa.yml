name: Intro Top Bottom QA

on:
  push:
    branches:
      - fix-intro-top-bottom-align
    paths:
      - 'index_files/main.css'
      - '.github/workflows/intro-top-bottom-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Render and measure
        run: |
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          sleep 2
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, os
          os.makedirs(".qa-intro-align", exist_ok=True)
          widths=[1440,1152,960,900,873,840,820,768]
          out={}
          with sync_playwright() as p:
              b=p.chromium.launch()
              for w in widths:
                  page=b.new_page(viewport={"width":w,"height":900})
                  page.goto("http://127.0.0.1:8000/index.html",wait_until="networkidle")
                  vals=page.evaluate("""() => {
                    const r=s=>document.querySelector(s).getBoundingClientRect();
                    const photo=r('.intro-photo-col > img');
                    const first=r('.intro-copy p');
                    const cv=r('.cv-navigation');
                    return {
                      photoTop:photo.top, firstTop:first.top,
                      topDelta:Math.abs(photo.top-first.top),
                      photoBottom:photo.bottom, cvBottom:cv.bottom,
                      bottomDelta:Math.abs(photo.bottom-cv.bottom),
                      photoWidth:photo.width,
                      scrollWidth:document.documentElement.scrollWidth,
                      clientWidth:document.documentElement.clientWidth
                    };
                  }""")
                  out[str(w)]=vals
                  page.screenshot(path=f".qa-intro-align/{w}.png",full_page=True)
                  page.close()
              b.close()
          open(".qa-intro-align/metrics.json","w").write(json.dumps(out,indent=2))
          PY
          for f in .qa-intro-align/*.png; do base64 -w0 "$f" > "$f.b64"; rm "$f"; done
      - name: Commit QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa-intro-align
          git commit -m "Add temporary intro top-bottom QA" || exit 0
          git push
