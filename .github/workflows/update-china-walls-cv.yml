name: Update China Walls CV citation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-china-walls-cv.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Edit Word CV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          path = Path("Wang_CV.docx")
          with ZipFile(path, "r") as zin:
              files = {name: zin.read(name) for name in zin.namelist()}

          xml = files["word/document.xml"].decode("utf-8")
          old = "JFE, Vol. 186 (2026)"
          new = "JFE, 2026"
          if xml.count(old) != 1:
              raise RuntimeError(f"Expected one occurrence of {old!r}, found {xml.count(old)}")
          xml = xml.replace(old, new, 1)
          files["word/document.xml"] = xml.encode("utf-8")

          tmp = path.with_suffix(".tmp.docx")
          with ZipFile(tmp, "w", ZIP_DEFLATED) as zout:
              for name, data in files.items():
                  zout.writestr(name, data)
          tmp.replace(path)
          PY
      - name: Regenerate and verify PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils
          mkdir -p /tmp/cv-render .qa-cv
          libreoffice -env:UserInstallation=file:///tmp/lo-cv-profile --headless --convert-to pdf --outdir /tmp/cv-render Wang_CV.docx
          test -s /tmp/cv-render/Wang_CV.pdf
          pdftotext -layout /tmp/cv-render/Wang_CV.pdf /tmp/cv.txt
          grep -F 'JFE, 2026' /tmp/cv.txt
          if grep -F 'JFE, Vol. 186 (2026)' /tmp/cv.txt; then
            echo 'Old volume citation remains in PDF'
            exit 1
          fi
          pdfinfo /tmp/cv-render/Wang_CV.pdf | grep '^Pages:'
          cp /tmp/cv-render/Wang_CV.pdf Wang_CV.pdf
          pdftoppm -f 2 -l 2 -png -r 144 Wang_CV.pdf .qa-cv/page >/dev/null 2>&1
          mv .qa-cv/page-2.png .qa-cv/china-walls-page.png
      - name: Commit CV and QA render
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Wang_CV.docx Wang_CV.pdf .qa-cv/china-walls-page.png
          git commit -m "Remove volume from China Walls CV citation"
          git push origin HEAD:main
