name: Photo Width QA

on:
  push:
    branches:
      - fix-photo-logo-width
    paths:
      - 'index_files/main.css'
      - '.github/workflows/photo-width-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Render and measure
        run: |
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          sleep 2
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, os
          os.makedirs(".qa-photo", exist_ok=True)
          widths=[1440,1152,960,873,820,720,640,576]
          out={}
          with sync_playwright() as p:
              b=p.chromium.launch()
              for w in widths:
                  page=b.new_page(viewport={"width":w,"height":900})
                  page.goto("http://127.0.0.1:8000/index.html",wait_until="networkidle")
                  vals=page.evaluate("""() => {
                    const r=s=>document.querySelector(s).getBoundingClientRect();
                    const logo=r('.div-logo img'), photo=r('.intro-photo-col > img'), cv=r('.cv-navigation');
                    return {
                      logoWidth:logo.width, photoWidth:photo.width,
                      widthDelta:Math.abs(logo.width-photo.width),
                      photoBottom:photo.bottom, cvBottom:cv.bottom,
                      bottomDelta:Math.abs(photo.bottom-cv.bottom),
                      scrollWidth:document.documentElement.scrollWidth,
                      clientWidth:document.documentElement.clientWidth
                    };
                  }""")
                  out[str(w)]=vals
                  page.screenshot(path=f".qa-photo/{w}.png",full_page=True)
                  page.close()
              b.close()
          open(".qa-photo/metrics.json","w").write(json.dumps(out,indent=2))
          PY
          for f in .qa-photo/*.png; do base64 -w0 "$f" > "$f.b64"; rm "$f"; done
      - name: Commit QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa-photo
          git commit -m "Add temporary portrait width QA" || exit 0
          git push
