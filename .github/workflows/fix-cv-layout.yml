name: Fix CV Four-Page Layout

on:
  push:
    paths:
      - '.github/workflows/fix-cv-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          python -m pip install python-docx
      - name: Remove only local blank paragraphs
        run: |
          python - <<'PY'
          from docx import Document
          doc=Document("Wang_CV.docx")
          targets=["Committee Work and Other Service","Invited Discussions"]
          removed=[]
          for target in targets:
              paras=doc.paragraphs
              idx=next((i for i,p in enumerate(paras) if " ".join(p.text.split())==target),None)
              if idx is not None and idx>0 and not paras[idx-1].text.strip():
                  p=paras[idx-1]._element
                  p.getparent().remove(p)
                  removed.append(target)
          print("Removed blank paragraph before:", removed)
          doc.save("Wang_CV.docx")
          PY
      - name: Render and require four pages
        run: |
          mkdir -p /tmp/cv-render
          libreoffice --headless --convert-to pdf --outdir /tmp/cv-render Wang_CV.docx
          pages=$(pdfinfo /tmp/cv-render/Wang_CV.pdf | awk '/^Pages:/ {print $2}')
          echo "Rendered pages: $pages"
          test "$pages" = "4"
          cp /tmp/cv-render/Wang_CV.pdf Wang_CV.pdf
      - name: Refresh QA diagnostics
        run: |
          rm -rf .cv-qa
          mkdir -p .cv-qa
          pdfinfo Wang_CV.pdf > .cv-qa/pdfinfo.txt
          for p in 1 2 3 4; do
            pdftotext -f "$p" -l "$p" -layout Wang_CV.pdf ".cv-qa/page-$p.txt"
            pdftoppm -f "$p" -singlefile -png -r 110 Wang_CV.pdf ".cv-qa/page-$p"
            base64 -w0 ".cv-qa/page-$p.png" > ".cv-qa/page-$p.png.b64"
            rm ".cv-qa/page-$p.png"
          done
      - name: Commit corrected source and PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wang_CV.docx Wang_CV.pdf .cv-qa
          git commit -m "Preserve four-page CV layout"
          git push
