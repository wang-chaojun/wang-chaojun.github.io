name: Compare Earlier Teaching Spacing

on:
  push:
    paths:
      - '.github/workflows/compare-earlier-teaching.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare historical Teaching and Advising layout
        run: |
          python -m pip install python-docx
          mkdir -p .cv-qa
          python - <<'PY'
          from docx import Document
          import subprocess
          refs = {
              "jfe_acceptance": "17300a7522fbb5d6aceb9474e5333296cd695b85",
              "china_walls_spacing": "d81a5896fcf9bfec457be21698f4c7bd0b0a172d",
              "four_page_squeeze": "b9fa9c84ebe3bcb442f7eaebbbbc03bbacb7288c",
              "current": "HEAD",
          }
          def pts(x): return None if x is None else x.pt
          out=[]
          for label,ref in refs.items():
              path=f"/tmp/{label}.docx"
              with open(path,"wb") as fh:
                  subprocess.run(["git","show",f"{ref}:Wang_CV.docx"],stdout=fh,check=True)
              doc=Document(path)
              out.append(f"## {label}")
              start=next(i for i,p in enumerate(doc.paragraphs) if p.text.strip().lower()=="teaching and advising")
              for i in range(max(0,start-2), min(len(doc.paragraphs),start+10)):
                  p=doc.paragraphs[i]
                  pf=p.paragraph_format
                  out.append(f"{i}: {p.text!r}")
                  out.append(f"   before={pts(pf.space_before)} after={pts(pf.space_after)} line={pf.line_spacing!r}")
              out.append("")
          open(".cv-qa/earlier-teaching-spacing.txt","w",encoding="utf-8").write("\n".join(out))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cv-qa/earlier-teaching-spacing.txt
          git commit -m "Add temporary earlier teaching spacing diagnostic"
          git push
