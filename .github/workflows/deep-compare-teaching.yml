name: Deep Compare Teaching Spacing

on:
  push:
    paths:
      - '.github/workflows/deep-compare-teaching.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare full paragraph properties
        run: |
          python -m pip install python-docx
          mkdir -p .cv-qa
          python - <<'PY'
          from docx import Document
          import subprocess
          refs = {
              "pre_squeeze": "d81a5896fcf9bfec457be21698f4c7bd0b0a172d",
              "current": "HEAD",
          }
          out=[]
          for label,ref in refs.items():
              path=f"/tmp/{label}.docx"
              with open(path,"wb") as fh:
                  subprocess.run(["git","show",f"{ref}:Wang_CV.docx"],stdout=fh,check=True)
              doc=Document(path)
              start=next(i for i,p in enumerate(doc.paragraphs) if p.text.strip().lower()=="teaching and advising")
              out.append(f"## {label}")
              for i in range(start-1, min(len(doc.paragraphs), start+8)):
                  p=doc.paragraphs[i]
                  out.append(f"### {i}: {p.text!r}")
                  out.append(p._p.xml)
              out.append("")
          open(".cv-qa/deep-teaching.xml.txt","w",encoding="utf-8").write("\n".join(out))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cv-qa/deep-teaching.xml.txt
          git commit -m "Add temporary deep Teaching spacing diagnostic"
          git push
