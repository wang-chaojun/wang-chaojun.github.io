name: QA CV render
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-cv-render.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Compare rendered PDFs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils python3-pil
          git show HEAD^:Wang_CV.pdf > /tmp/new.pdf
          git show HEAD^^:Wang_CV.pdf > /tmp/old.pdf
          mkdir -p /tmp/newpng /tmp/oldpng
          pdftoppm -png -r 144 /tmp/new.pdf /tmp/newpng/page >/dev/null 2>&1
          pdftoppm -png -r 144 /tmp/old.pdf /tmp/oldpng/page >/dev/null 2>&1
          pdftotext -layout /tmp/new.pdf /tmp/new.txt
          grep -F 'Updated November, 2026' /tmp/new.txt
          grep -F 'JFE, Vol. 186 (2026)' /tmp/new.txt
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import subprocess

          old_pages = sorted(Path('/tmp/oldpng').glob('page-*.png'))
          new_pages = sorted(Path('/tmp/newpng').glob('page-*.png'))
          assert len(old_pages) == len(new_pages), (len(old_pages), len(new_pages))

          expected = set()
          for i in range(1, len(new_pages)+1):
              text = subprocess.check_output(
                  ['pdftotext','-f',str(i),'-l',str(i),'-layout','/tmp/new.pdf','-'],
                  text=True
              )
              if 'Updated November, 2026' in text or 'JFE, Vol. 186 (2026)' in text:
                  expected.add(i)

          changed = set()
          report = []
          for i,(op,np) in enumerate(zip(old_pages,new_pages),1):
              a=Image.open(op).convert('RGB')
              b=Image.open(np).convert('RGB')
              assert a.size == b.size
              diff=ImageChops.difference(a,b)
              bbox=diff.getbbox()
              if bbox:
                  changed.add(i)
                  w,h=a.size
                  area=(bbox[2]-bbox[0])*(bbox[3]-bbox[1])/(w*h)
                  report.append((i,bbox,round(area,5)))
                  assert area < 0.15, (i,bbox,area)

          print('expected_changed_pages=', sorted(expected))
          print('actual_changed_pages=', sorted(changed))
          print('diff_report=', report)
          assert changed <= expected, (changed, expected)
          assert expected <= changed, (expected, changed)
          PY
