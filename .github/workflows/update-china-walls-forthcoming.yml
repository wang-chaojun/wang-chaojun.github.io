name: Update China Walls to Forthcoming

on:
  push:
    paths:
      - '.github/workflows/update-china-walls-forthcoming.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          python -m pip install python-docx
      - name: Update China Walls status only
        run: |
          python - <<'PY'
          from docx import Document
          path="Wang_CV.docx"
          doc=Document(path)
          target=None
          for p in doc.paragraphs:
              if "China Walls" in p.text:
                  target=p
                  break
          if target is None:
              raise SystemExit("China Walls paragraph not found")
          old="Conditionally accepted at JFE"
          new="Forthcoming at JFE"
          if old not in target.text:
              raise SystemExit(f"Expected old status not found: {target.text!r}")
          changed=False
          for r in target.runs:
              if old in r.text:
                  r.text=r.text.replace(old,new)
                  changed=True
                  break
          if not changed:
              full=target.text.replace(old,new)
              target.clear()
              target.add_run(full)
          doc.save(path)
          PY
      - name: Render PDF and QA pages
        run: |
          mkdir -p /tmp/cv-render .cv-qa
          libreoffice --headless --convert-to pdf --outdir /tmp/cv-render Wang_CV.docx
          test -s /tmp/cv-render/Wang_CV.pdf
          pdftotext -layout /tmp/cv-render/Wang_CV.pdf /tmp/cv.txt
          grep -q "Forthcoming at JFE" /tmp/cv.txt
          ! grep -q "Conditionally accepted at JFE" /tmp/cv.txt
          grep -q "Updated October, 2026" /tmp/cv.txt
          grep -q "Holden Conference" /tmp/cv.txt
          cp /tmp/cv-render/Wang_CV.pdf Wang_CV.pdf
          pages=$(pdfinfo Wang_CV.pdf | awk '/^Pages:/ {print $2}')
          echo "Rendered pages: $pages"
          pdfinfo Wang_CV.pdf > .cv-qa/pdfinfo.txt
          for p in $(seq 1 "$pages"); do
            pdftoppm -f "$p" -singlefile -png -r 110 Wang_CV.pdf "/tmp/page-$p"
            base64 -w0 "/tmp/page-$p.png" > ".cv-qa/page-$p.png.b64"
          done
      - name: Commit CV and PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wang_CV.docx Wang_CV.pdf .cv-qa
          git commit -m "Mark China Walls forthcoming at JFE"
          git push
