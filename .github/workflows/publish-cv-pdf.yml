name: Publish updated CV PDF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cv-pdf.yml'
permissions:
  contents: write
jobs:
  render-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current website
        uses: actions/checkout@v4
      - name: Convert Word CV and verify citation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils
          mkdir -p /tmp/rendered-cv
          libreoffice -env:UserInstallation=file:///tmp/lo-cv-profile --headless --convert-to pdf --outdir /tmp/rendered-cv Wang_CV.docx
          test -s /tmp/rendered-cv/Wang_CV.pdf
          pdftotext -layout /tmp/rendered-cv/Wang_CV.pdf /tmp/cv-text.txt
          grep -F 'JFE, Vol. 186 (2026)' /tmp/cv-text.txt
          if grep -F 'Forthcoming at JFE' /tmp/cv-text.txt; then
            echo 'Old citation remains in PDF'
            exit 1
          fi
          pdfinfo /tmp/rendered-cv/Wang_CV.pdf | grep '^Pages:'
          cp /tmp/rendered-cv/Wang_CV.pdf Wang_CV.pdf
      - name: Refresh the PDF cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('index.html')
          content = page.read_text()
          old = r'(Wang_CV\.pdf\?v=)[0-9]{6}'
          updated, n = re.subn(old, r'\g<1>202611', content)
          if n != 1:
              raise RuntimeError(f'Expected one PDF link, found {n}')
          page.write_text(updated)
          PY
      - name: Commit published PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Wang_CV.pdf index.html
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate published CV PDF from updated Word CV"
            git push origin HEAD:main
          fi
