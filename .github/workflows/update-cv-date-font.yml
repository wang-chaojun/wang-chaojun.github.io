name: Update CV date and publication font
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-cv-date-font.yml'
permissions:
  contents: write
jobs:
  update-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Word CV and homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import shutil, tempfile

          docx = Path("Wang_CV.docx")
          with ZipFile(docx, "r") as zin:
              files = {name: zin.read(name) for name in zin.namelist()}

          xml = files["word/document.xml"].decode("utf-8")

          old_run = '<w:r><w:t>4. China Walls</w:t><w:tab/><w:t>JFE, Vol. 186 (2026)</w:t></w:r>'
          new_run = '<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/></w:rPr><w:t>4. China Walls</w:t><w:tab/><w:t>JFE, Vol. 186 (2026)</w:t></w:r>'
          if xml.count(old_run) != 1:
              raise RuntimeError(f"Expected one China Walls run, found {xml.count(old_run)}")
          xml = xml.replace(old_run, new_run, 1)

          old_month = '<w:t>October</w:t>'
          if xml.count(old_month) != 1:
              raise RuntimeError(f"Expected one October run, found {xml.count(old_month)}")
          xml = xml.replace(old_month, '<w:t>November</w:t>', 1)
          files["word/document.xml"] = xml.encode("utf-8")

          tmp = docx.with_suffix(".tmp.docx")
          with ZipFile(tmp, "w", ZIP_DEFLATED) as zout:
              for name, data in files.items():
                  zout.writestr(name, data)
          tmp.replace(docx)

          page = Path("index.html")
          html = page.read_text()
          old = '<li class="abstract"> (October 2026) </li>'
          new = '<li class="abstract"> (November 2026) </li>'
          if html.count(old) != 1:
              raise RuntimeError(f"Expected one homepage CV date, found {html.count(old)}")
          page.write_text(html.replace(old, new, 1))
          PY
      - name: Convert and verify PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils
          mkdir -p /tmp/cv-render
          libreoffice -env:UserInstallation=file:///tmp/lo-cv-profile --headless --convert-to pdf --outdir /tmp/cv-render Wang_CV.docx
          test -s /tmp/cv-render/Wang_CV.pdf
          pdftotext -layout /tmp/cv-render/Wang_CV.pdf /tmp/cv.txt
          grep -F 'JFE, Vol. 186 (2026)' /tmp/cv.txt
          grep -F 'Updated November, 2026' /tmp/cv.txt
          if grep -F 'Updated October, 2026' /tmp/cv.txt; then
            echo 'Old CV date remains'
            exit 1
          fi
          pdfinfo /tmp/cv-render/Wang_CV.pdf | grep '^Pages:'
          cp /tmp/cv-render/Wang_CV.pdf Wang_CV.pdf
      - name: Commit updated CV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Wang_CV.docx Wang_CV.pdf index.html
          git commit -m "Update CV date and publication formatting"
          git push origin HEAD:main
