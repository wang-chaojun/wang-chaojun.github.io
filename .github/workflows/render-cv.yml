name: Render CV PDF

on:
  push:
    paths:
      - 'Wang_CV.docx'
      - '.github/workflows/render-cv.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
      - name: Render CV PDF
        run: |
          mkdir -p /tmp/cv-render
          libreoffice --headless --convert-to pdf --outdir /tmp/cv-render Wang_CV.docx
          test -s /tmp/cv-render/Wang_CV.pdf
          cp /tmp/cv-render/Wang_CV.pdf Wang_CV.pdf
      - name: Commit rendered PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wang_CV.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate CV PDF"
          git push
