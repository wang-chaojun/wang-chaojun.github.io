name: Inspect CV PDF

on:
  push:
    paths:
      - '.github/workflows/inspect-cv.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Build diagnostics
        run: |
          rm -rf .cv-qa
          mkdir -p .cv-qa
          pdfinfo Wang_CV.pdf > .cv-qa/pdfinfo.txt
          for p in 1 2 3 4 5; do
            pdftotext -f "$p" -l "$p" -layout Wang_CV.pdf ".cv-qa/page-$p.txt"
            pdftoppm -f "$p" -singlefile -png -r 110 Wang_CV.pdf ".cv-qa/page-$p"
            base64 -w0 ".cv-qa/page-$p.png" > ".cv-qa/page-$p.png.b64"
            rm ".cv-qa/page-$p.png"
          done
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cv-qa
          git commit -m "Add temporary CV QA diagnostics"
          git push
