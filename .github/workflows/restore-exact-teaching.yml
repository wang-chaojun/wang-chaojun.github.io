name: Restore Exact Teaching Block

on:
  push:
    paths:
      - '.github/workflows/restore-exact-teaching.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          python -m pip install python-docx
      - name: Restore exact pre-squeeze Teaching block
        run: |
          git show d81a5896fcf9bfec457be21698f4c7bd0b0a172d:Wang_CV.docx > /tmp/pre-squeeze.docx
          python - <<'PY'
          from copy import deepcopy
          from docx import Document

          current = Document("Wang_CV.docx")
          old = Document("/tmp/pre-squeeze.docx")

          def block(doc):
              ps = doc.paragraphs
              h = next(i for i,p in enumerate(ps) if p.text.strip().lower() == "teaching and advising")
              start = h - 1 if h > 0 and not ps[h-1].text.strip() else h
              return ps, start

          cps, cs = block(current)
          ops, os = block(old)

          current_text = [p.text for p in cps[cs:]]
          old_text = [p.text for p in ops[os:]]
          if current_text != old_text:
              raise SystemExit("Teaching block text differs from pre-squeeze source; refusing broad replacement")

          body = current._element.body
          current_nodes = [p._p for p in cps[cs:]]
          insert_at = body.index(current_nodes[0])
          for node in current_nodes:
              body.remove(node)

          old_nodes = [deepcopy(p._p) for p in ops[os:]]
          for offset,node in enumerate(old_nodes):
              body.insert(insert_at + offset, node)

          current.save("Wang_CV.docx")
          PY
      - name: Render and verify
        run: |
          mkdir -p /tmp/cv-render
          libreoffice --headless --convert-to pdf --outdir /tmp/cv-render Wang_CV.docx
          test -s /tmp/cv-render/Wang_CV.pdf
          pdfinfo /tmp/cv-render/Wang_CV.pdf
          pdftotext -layout /tmp/cv-render/Wang_CV.pdf /tmp/cv.txt
          grep -q "Updated October, 2026" /tmp/cv.txt
          grep -q "Holden Conference" /tmp/cv.txt
          grep -q "Teaching and Advising" /tmp/cv.txt
          cp /tmp/cv-render/Wang_CV.pdf Wang_CV.pdf
          pages=$(pdfinfo Wang_CV.pdf | awk '/^Pages:/ {print $2}')
          last=$pages
          pdftoppm -f "$last" -singlefile -png -r 120 Wang_CV.pdf /tmp/last-page
          mkdir -p .cv-qa
          base64 -w0 /tmp/last-page.png > .cv-qa/last-page.png.b64
          pdfinfo Wang_CV.pdf > .cv-qa/pdfinfo.txt
      - name: Commit restored block
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wang_CV.docx Wang_CV.pdf .cv-qa
          git commit -m "Restore exact Teaching and Advising formatting"
          git push
