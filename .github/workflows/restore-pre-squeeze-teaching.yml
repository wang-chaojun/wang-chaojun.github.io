name: Restore Pre-Squeeze Teaching Block

on:
  push:
    paths:
      - '.github/workflows/restore-pre-squeeze-teaching.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          python -m pip install python-docx
      - name: Restore Teaching block from before all squeezes
        run: |
          git show e05a51d8e059342771bb4febf2382f6214bd6d07:Wang_CV.docx > /tmp/pre-squeeze.docx
          python - <<'PY'
          from copy import deepcopy
          from docx import Document

          current = Document("Wang_CV.docx")
          old = Document("/tmp/pre-squeeze.docx")

          def block(doc):
              ps = doc.paragraphs
              h = next(i for i,p in enumerate(ps) if p.text.strip().lower() == "teaching and advising")
              start = h - 1 if h > 0 and not ps[h-1].text.strip() else h
              return ps, start

          cps, cs = block(current)
          ops, os = block(old)

          cur_nonblank=[p.text for p in cps[cs:] if p.text.strip()]
          old_nonblank=[p.text for p in ops[os:] if p.text.strip()]
          if cur_nonblank != old_nonblank:
              raise SystemExit("Nonblank Teaching content differs from historical source")

          body=current._element.body
          current_nodes=[p._p for p in cps[cs:]]
          insert_at=body.index(current_nodes[0])
          for node in current_nodes:
              body.remove(node)
          for offset,p in enumerate(ops[os:]):
              body.insert(insert_at+offset, deepcopy(p._p))
          current.save("Wang_CV.docx")
          PY
      - name: Render and verify
        run: |
          mkdir -p /tmp/cv-render
          libreoffice --headless --convert-to pdf --outdir /tmp/cv-render Wang_CV.docx
          test -s /tmp/cv-render/Wang_CV.pdf
          pdftotext -layout /tmp/cv-render/Wang_CV.pdf /tmp/cv.txt
          grep -qi "Updated October, 2026" /tmp/cv.txt
          grep -qi "Holden Conference" /tmp/cv.txt
          grep -qi "Teaching and Advising" /tmp/cv.txt
          cp /tmp/cv-render/Wang_CV.pdf Wang_CV.pdf
          pages=$(pdfinfo Wang_CV.pdf | awk '/^Pages:/ {print $2}')
          echo "Rendered pages: $pages"
          mkdir -p .cv-qa
          for p in 4 5; do
            pdftoppm -f "$p" -singlefile -png -r 120 Wang_CV.pdf "/tmp/page-$p"
            base64 -w0 "/tmp/page-$p.png" > ".cv-qa/page-$p.png.b64"
          done
          pdfinfo Wang_CV.pdf > .cv-qa/pdfinfo.txt
      - name: Commit restored block
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wang_CV.docx Wang_CV.pdf .cv-qa
          git commit -m "Restore remaining Teaching and Advising spacing"
          git push
