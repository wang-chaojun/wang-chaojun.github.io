name: Inspect Final Teaching Page

on:
  push:
    paths:
      - '.github/workflows/inspect-final-teaching.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render pages 4 and 5
        run: |
          python -m pip install pymupdf
          python - <<'PY'
          import base64, fitz, os
          os.makedirs(".cv-qa", exist_ok=True)
          doc=fitz.open("Wang_CV.pdf")
          for pno in [3,4]:
              pix=doc[pno].get_pixmap(matrix=fitz.Matrix(1.7,1.7), alpha=False)
              data=pix.tobytes("png")
              with open(f".cv-qa/page-{pno+1}.png.b64","w") as f:
                  f.write(base64.b64encode(data).decode())
          PY
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cv-qa/page-4.png.b64 .cv-qa/page-5.png.b64
          git commit -m "Add temporary final Teaching page renders"
          git push
